<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BizFlow — professional business management for shops and teams. Customers, inventory, orders, invoices, and assigned work in one secure workspace. Web now. iOS & Android coming soon."
    />
    <meta name="theme-color" content="#0B0F0D" />
    <title>BizFlow — Business management for real shops</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('bizflow_theme')
          var theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          var savedLocale = localStorage.getItem('bizflow_locale')
          if (savedLocale === 'en' || savedLocale === 'sq' || savedLocale === 'de') {
            document.documentElement.lang = savedLocale
          }
        } catch (error) {}
      })()
    </script>
